name: Build N60 Pro High-Power sysupgrade

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: padavanonly/immortalwrt-mt798x-6.6
          fetch-depth: 1
          ref: 2410

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Prepare N60 Pro high-power config only
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp defconfig/nx60pro-ipailna-high-power.config .config
          sed -i \
            -e '/^CONFIG_TARGET_MULTI_PROFILE=/c\# CONFIG_TARGET_MULTI_PROFILE is not set' \
            -e '/^CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_/d' \
            -e '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7986_DEVICE_/d' \
            .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_netcore_n60-pro=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7986_DEVICE_netcore_n60-pro=""
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET|netcore_n60-pro|mt_wifi|mtwifi|luci-app-mtwifi|turboacc-mtk' .config || true

      - name: Build sysupgrade image
        run: |
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Collect N60 Pro sysupgrade
        shell: bash
        run: |
          mkdir -p artifact
          find bin/targets -type f \( -name '*netcore*n60*pro*sysupgrade*.bin' -o -name '*n60-pro*sysupgrade*.bin' \) -print -exec cp -v {} artifact/ \;
          (cd artifact && sha256sum * > sha256sums.txt)
          find artifact -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-high-power-sysupgrade
          path: artifact/*
